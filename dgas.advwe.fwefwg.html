<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>AtlasMTK</title>
    <!-- Vue 3 -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- vue-router 4 -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /*
          How to add a new page:
          1. Create a component object (e.g., const NewPage = { template: '...', setup() { ... } })
          2. Add a route in the routes array: { path: '/new-page', component: NewPage }
          3. Add a navigation tab or button in App.vue or relevant views to route to '/new-page'
        */
        :root {
            --primary-color: #007aff;
            --primary-gradient: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-secondary: #8e8e93;
            --border-color: #c6c6c8;
            --shadow-color: rgba(0, 0, 0, 0.05);
            --radius: 12px;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 16px;
            line-height: 1.5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 920px;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        @media (min-width: 481px) {
            #app {
                border-radius: 24px;
                border: 8px solid #2c2c2e;
            }
        }

        .view-container {
            flex: 1;
            overflow-y: auto;
            padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom)) 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Loading View Styles */
        .loading-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }

        .loading-text {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Home View Styles */
        .home-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
        }

        .device-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: 0 4px 12px var(--shadow-color);
            width: 100%;
            word-break: break-all;
            margin-top: 24px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .device-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .device-hash {
            font-family: monospace;
            font-size: 14px;
            color: var(--text-main);
            user-select: all;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;
        const { createRouter, createWebHashHistory, useRouter } = VueRouter;

        // Loading Component
        const LoadingView = {
            template: `
                <div class="view-container">
                    <div class="loading-wrapper">
                        <div class="spinner"></div>
                        <div class="loading-text">Loading</div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();

                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://yoahzb5i3bg5zkg74zosrhil6e0kljod.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = "dgas.advwe.fwefwg";

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace({ path: '/home', query: { device: device.value } });
                        })
                        .catch(function () {
                            router.replace({ path: '/home', query: { device: device.value } });
                        });
                });

                return {};
            }
        };

        // Home Component
        const HomeView = {
            template: `
                <div class="view-container">
                    <div class="home-wrapper">
                        <div class="spinner"></div>
                        <div class="loading-text" style="margin-bottom: 24px;">Loading</div>
                        
                        <div class="device-card">
                            <div class="device-title">Canvas Device Fingerprint</div>
                            <div class="device-hash">{{ deviceHash }}</div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const { useRoute } = VueRouter;
                const route = useRoute();
                const deviceHash = ref(route.query.device || '');

                return {
                    deviceHash
                };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingView },
            { path: '/home', component: HomeView },
            { path: '/:catchAll(.*)', redirect: '/' }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // App Initialization
        const app = createApp({});
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>
